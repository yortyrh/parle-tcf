# Local development infrastructure only: the apps run on the host (`pnpm dev`).
# Start with `pnpm infra:up` (also applies migrations), stop with `pnpm infra:down`.
# Ports are overridable; `pnpm setup:env` reads the same variables.
name: parle-tcf-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: parle
      POSTGRES_PASSWORD: parle
      POSTGRES_DB: parle
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - parle-tcf-dev-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U parle -d parle']
      interval: 2s
      timeout: 5s
      retries: 30

  # S3-compatible object storage for consented attempt recordings. Console UI on :9001.
  # `pnpm infra:up` creates the bucket and its CORS rules; any S3 server works.
  storage:
    image: docker.io/rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: parle
      RUSTFS_SECRET_KEY: parle-dev-secret
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '${STORAGE_PORT:-9000}:9000'
      - '${STORAGE_CONSOLE_PORT:-9001}:9001'
    volumes:
      - parle-tcf-dev-storage:/data

  # SMTP sink for verification, reset and account-deletion emails. Inbox UI on :8025.
  mailpit:
    image: axllent/mailpit:v1.33.0
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'

volumes:
  parle-tcf-dev-pgdata:
  parle-tcf-dev-storage:
