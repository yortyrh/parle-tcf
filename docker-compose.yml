services:
  agent:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    container_name: tcf-agent
    environment:
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PORT=8080
      - NODE_ENV=production
    volumes:
      - ./apps/agent/config:/app/apps/agent/config:ro
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - tcf-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r => { if (!r.ok) process.exit(1) })"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: tcf-web
    environment:
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - LIVEKIT_URL=${LIVEKIT_URL}
      - AGENT_WAKE_URL=http://agent:8080
      - NODE_ENV=production
    ports:
      - "80:3000"
    restart: unless-stopped
    networks:
      - tcf-network
    depends_on:
      - agent
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  tcf-network:
    driver: bridge
