services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: parle-tcf-api
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PORT=3001
      - NODE_ENV=production
      - CORS_ORIGINS=http://localhost:3000,http://web:3000
    volumes:
      - ./apps/api/config:/app/apps/api/config:ro
    ports:
      - "3001:3001"
    restart: unless-stopped
    networks:
      - parle-tcf-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/health').then(r => { if (!r.ok) process.exit(1) })",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Must be reachable from the host browser (not the Docker service hostname).
        NEXT_PUBLIC_EXAM_API_URL: http://localhost:3001
    container_name: parle-tcf-web
    environment:
      - NODE_ENV=production
    ports:
      - "80:3000"
    restart: unless-stopped
    networks:
      - parle-tcf-network
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  parle-tcf-network:
    driver: bridge
