name: Setup monorepo
description: pnpm, Node from .nvmrc (with the pnpm store cache) and a frozen install.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v5
      with:
        version: 10.33.0
    - uses: actions/setup-node@v5
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
