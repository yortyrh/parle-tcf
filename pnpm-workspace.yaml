packages:
  - 'apps/*'
  - 'packages/*'

# Dependencies allowed (true) or denied (false) to run install scripts. pnpm 11+ fails the
# install when a dependency with a build script is in neither list.
allowBuilds:
  '@nestjs/core': true
  '@swc/core': false
  '@tailwindcss/oxide': true
  better-sqlite3: false
  cpu-features: false
  esbuild: true
  lefthook: true
  protobufjs: false
  sharp: true
  ssh2: false
  unrs-resolver: true

patchedDependencies:
  '@openai/agents-core@0.8.2': patches/@openai__agents-core@0.8.2.patch
  '@openai/agents-realtime@0.8.2': patches/@openai__agents-realtime@0.8.2.patch

# Security fixes inside the same major version for transitive dependencies that their parents
# pin (Next.js 15 pins postcss 8.4.x). Drop an entry once the parent ships the fix itself.
overrides:
  postcss@<8.5.10: ^8.5.10
  postcss-selector-parser@<6.1.5: ^6.1.5
