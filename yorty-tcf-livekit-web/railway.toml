# Railway: set service root directory to this folder (yorty-tcf-livekit-web) and,
# if needed, point "Config as code" to this file: yorty-tcf-livekit-web/railway.toml
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Evaluated from the repository root (monorepo)
watchPatterns = ["yorty-tcf-livekit-web/**"]

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
