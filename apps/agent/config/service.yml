# Configuration du service LiveKit Agent

# Modèle de langage (LLM)
llm:
  provider: "openai"
  model: "realtime"
  
  # Configuration de la voix
  voice: "alloy"  # Options: alloy, echo, fable, onyx, nova, shimmer
  
  # Modalités supportées
  modalities:
    - "text"
    - "audio"

# Configuration de la session
session:
  # Collecte des métriques de performance
  metricsEnabled: true
  
  # Options d'entrée audio
  inputOptions:
    # Annulation de bruit (LiveKit Cloud)
    # Pour l'instant, seul BackgroundVoiceCancellation est supporté
    noiseCancellation: "BackgroundVoiceCancellation"

# Configuration de la connexion
connection:
  # Temps max (ms) pour attendre qu'au moins un participant (candidat) soit dans la salle
  # avant de lire les métadonnées (taskType). Un délai trop court faisait lire le jeton
  # avant l'arrivée du client → mauvaise tâche / greeting retardé.
  participantWaitTime: 15000
  # Intervalle entre deux vérifications de présence du participant (ms)
  participantJoinPollIntervalMs: 200
  
  # Délai avant déconnexion après fin d'examen (ms)
  disconnectDelay: 3000

# Scale-to-zero : arrêt automatique après inactivité
scaling:
  # Durée d'inactivité (ms) avant arrêt du processus.
  # Railway relancera le container au prochain appel /wake.
  # Défaut : 600000 (10 minutes). Mettre 0 pour désactiver.
  idleTimeoutMs: 600000
