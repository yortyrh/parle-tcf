# Global Realtime defaults for session creation (NestJS API).
# Task-specific prompts live under config/agents/*.yml — see EXERCISES.md at repo root.

llm:
  provider: "openai"
  # Sent to OpenAI client_secrets. Use "realtime" to mean "default Realtime model"
  # (overridable with env OPENAI_REALTIME_MODEL in ExamSessionService).
  model: "realtime"
  voice: "alloy" # OpenAI Realtime output voices: alloy, echo, fable, onyx, nova, shimmer
  modalities:
    - "text"
    - "audio"

# --- Legacy / unused by the current browser Realtime flow ---
# The Nest API only requires llm.voice and llm.model when loading this file.
# The blocks below are kept for reference (older LiveKit agent layout).

session:
  metricsEnabled: true
  inputOptions:
    noiseCancellation: "BackgroundVoiceCancellation"

connection:
  participantWaitTime: 15000
  participantJoinPollIntervalMs: 200
  disconnectDelay: 3000
